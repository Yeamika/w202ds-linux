; W202DS ALSA card "Speakers": four AW88166 speakers on PCM 0 and the
; UMP9620 MIC1 (main, left) / MIC3 (back, right) capture on PCM 1. The default
; profile set probes only PCM 0, so it never finds the microphones.

[General]
auto-profiles = yes

[Mapping speakers]
description = Speakers
device-strings = hw:%f,0
channel-map = front-left,front-right
direction = output
priority = 100

[Mapping microphones]
description = Microphones
device-strings = hw:%f,1
channel-map = front-left,front-right
direction = input
priority = 100
